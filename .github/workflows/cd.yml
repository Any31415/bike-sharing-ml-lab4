name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  functional-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DVC
        run: |
          pip install "dvc[gdrive]"
          pip install "pyOpenSSL==24.2.1"

      - name: Pull data and model from DVC
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS_DATA }}' > gdrive-credentials.json
          dvc remote modify storage --local gdrive_service_account_json_file_path gdrive-credentials.json
          dvc pull
      - name: Create .env for docker-compose
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=bike_sharing" >> .env
          echo "VAULT_PASSWORD=${{ secrets.VAULT_PASSWORD }}" >> .env

      - name: Start containers
        run: docker compose up -d --build

      - name: Wait for services to start
        run: sleep 25

      - name: Health check
        run: curl -f http://localhost:8000/ || exit 1

      - name: Test prediction endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"season":3,"holiday":0,"workingday":1,"weather":1,"temp":25,"humidity":55,"windspeed":8,"hour":8,"dayofweek":2,"month":7}' \
            || exit 1

      - name: Show API logs (for debugging)
        if: always()
        run: docker logs bike-sharing-container

      - name: Check data was saved to MySQL
        run: |
          COUNT=$(docker exec bike-sharing-db mysql -u root -p"${{ secrets.MYSQL_ROOT_PASSWORD }}" -N -s -e "SELECT COUNT(*) FROM bike_sharing.predictions;")
          echo "Rows in predictions table: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No data found in predictions table"
            exit 1
          fi

      - name: Stop containers
        if: always()
        run: docker compose down -v
