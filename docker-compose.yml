version: '3.8'

services:
  vault-init:
    build:
      context: .
      dockerfile: vault-init/Dockerfile
    image: bike-sharing-lab4-vault-init
    container_name: bike-sharing-lab4-vault-init
    environment:
      VAULT_PASSWORD: ${VAULT_PASSWORD}
    volumes:
      - secrets-data:/secrets

  api:
    build: .
    image: bike-sharing-lab4-api
    container_name: bike-sharing-lab4-api
    depends_on:
      - vault-init
      - kafka
    volumes:
      - secrets-data:/secrets
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: bike-sharing-lab4-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.7.0
    container_name: bike-sharing-lab4-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    image: bike-sharing-lab4-consumer
    container_name: bike-sharing-lab4-consumer
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    volumes:
      - secrets-data:/secrets
    environment:
      - PYTHONUNBUFFERED=1
volumes:
  secrets-data:
  db-data:
